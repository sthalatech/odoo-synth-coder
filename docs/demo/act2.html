<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>odoo-synth — Concurrent Agent Sessions</title>
<style>
  :root{
    --bg:#0b0f17; --panel:#121826; --panel2:#1a2236; --ink:#e6ebf5; --mut:#8b97b4;
    --acc:#5b8cff; --acc2:#22c1a3; --warn:#f0a93b; --line:#26304a;
    --term:#0a0e16; --green:#3ee08a; --amber:#e0b341; --blue:#6aa8ff; --red:#ff6b6b; --dim:#5a6585;
    --a:#6aa8ff; --b:#e0b341; --c:#22c1a3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial,sans-serif;overflow:hidden}
  .stage{display:flex;flex-direction:column;height:100vh;padding:14px 18px 12px}
  header{display:flex;align-items:baseline;gap:12px;margin-bottom:8px;flex-wrap:wrap}
  h1{font-size:21px;margin:0;letter-spacing:-.4px}
  .pill{font-size:11px;padding:3px 10px;border-radius:6px;background:var(--acc);color:#0b0f17;font-weight:800;letter-spacing:.5px}
  .real{font-size:11px;padding:3px 10px;border-radius:6px;background:var(--acc2);color:#0b0f17;font-weight:800}
  .sub{color:var(--mut);font-size:13px}
  .controls{margin-left:auto;display:flex;gap:8px;align-items:center}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-size:13px;padding:6px 13px;border-radius:8px;cursor:pointer;font-weight:600}
  .btn:hover{border-color:var(--acc)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.go{background:var(--acc);color:#0b0f17;border-color:var(--acc)}
  .timer{font-size:15px;font-weight:800;color:var(--acc2);font-variant-numeric:tabular-nums;min-width:56px}
  select.btn{padding:5px 8px}

  /* beat rail */
  .rail{display:flex;gap:0;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;margin-bottom:10px;flex-wrap:wrap}
  .beat{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);padding:3px 8px}
  .beat .dot{width:9px;height:9px;border-radius:50%;background:var(--line);transition:.3s}
  .beat.on{color:var(--ink)}
  .beat.on .dot{background:var(--acc);box-shadow:0 0 8px var(--acc)}
  .beat.done{color:var(--acc2)}
  .beat.done .dot{background:var(--acc2)}
  .beat .arr{color:var(--line);margin-left:2px}
  .beat.done .arr,.beat.on .arr{color:var(--acc2)}

  .cols{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;min-height:0}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;border-top:3px solid var(--c-accent)}
  .col.a{--c-accent:var(--a)} .col.b{--c-accent:var(--b)} .col.c{--c-accent:var(--c)}
  .col-head{display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
  .col-badge{font-size:13px;font-weight:800;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#0b0f17}
  .col.a .col-badge{background:var(--a)} .col.b .col-badge{background:var(--b)} .col.c .col-badge{background:var(--c)}
  .col-title{font-size:12.5px;font-weight:700;line-height:1.2}
  .col-hat{font-size:10.5px;color:var(--mut)}
  .col-status{margin-left:auto;font-size:10px;color:var(--mut);font-family:ui-monospace,Menlo,monospace}
  .term-body{flex:1;overflow:auto;padding:10px 12px;font-family:ui-monospace,Menlo,monospace;font-size:11.6px;line-height:1.5;background:var(--term)}
  .line{white-space:pre-wrap;word-break:break-all}
  .prompt{color:var(--acc2)} .cmd{color:var(--ink)} .ok{color:var(--green)}
  .warn{color:var(--amber)} .info{color:var(--blue)} .mut{color:var(--mut)}
  .tool{color:var(--blue)} .reason{color:var(--dim);font-style:italic}
  .head{color:var(--ink);font-weight:700} .check{color:var(--amber)}
  .cursor{display:inline-block;width:7px;height:13px;background:var(--green);vertical-align:-2px;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .col-foot{padding:7px 10px;border-top:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;gap:8px}
  .col-cont{flex:1;background:var(--panel);border:1px solid var(--acc2);color:var(--acc2);font-weight:700;font-size:12px;padding:6px 10px;border-radius:7px;cursor:pointer}
  .col-cont:hover{background:var(--acc2);color:#0b0f17}
  .col-cont:disabled{opacity:.35;cursor:default;border-color:var(--line);color:var(--mut)}
  .col-cont.pulse{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,193,163,.5)}50%{box-shadow:0 0 0 7px rgba(34,193,163,0)}}
  .outcome{font-size:11px;color:var(--green);font-weight:600}
  .hint{font-size:10px;color:var(--mut)}
</style>
</head>
<body>
<div class="stage">
  <div class="rail" id="rail"></div>

  <div class="cols" id="cols"></div>
</div>

<script src="captures/act2_data.js"></script>
<script>
const BEATS=["BOOT","EXPLORE","DIAGNOSE","FIX","VERIFY","PR"];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shortIssue(s){return s.replace('iss','#').replace('iss','');}

// ---- build rail ----
const rail=document.getElementById('rail');
BEATS.forEach((b,i)=>{
  const el=document.createElement('div');el.className='beat';el.id='beat-'+i;
  el.innerHTML='<span class="dot"></span>'+b+(i<BEATS.length-1?'<span class="arr"> →</span>':'');
  rail.appendChild(el);
});

// ---- build columns ----
const colsEl=document.getElementById('cols');
const LETTERS=['A','B','C'];
DATA.forEach((d,ci)=>{
  const col=document.createElement('div');col.className='col '+LETTERS[ci].toLowerCase();
  const totalLines=d.beats.reduce((a,b)=>a+b.lines.length,0);
  col.innerHTML=
    '<div class="col-head"><div class="col-badge">'+LETTERS[ci]+'</div>'+
    '<div><div class="col-title">'+esc(d.title)+'</div>'+
    '<div class="col-hat">'+esc(d.role)+' · workspace</div></div>'+
    '<div class="col-status" id="stat-'+ci+'">phase 1/6</div></div>'+
    '<div class="term-body" id="term-'+ci+'"></div>'+
    '<div class="col-foot">'+
      '<button class="col-cont" id="cont-'+ci+'">▶ Begin</button>'+
      '<span class="outcome" id="out-'+ci+'"></span>'+
    '</div>';
  colsEl.appendChild(col);
});

// ---- per-column player state ----
let speed=1, globalPlay=false, t0=null, tInterval=null;
const players=DATA.map((d,ci)=>({
  ci, d, beat:0, li:0, typing:false, done:false, paused:true, timer:null, cur:null, cc:0,
  term:document.getElementById('term-'+ci),
  cont:document.getElementById('cont-'+ci),
  stat:document.getElementById('stat-'+ci),
  out:document.getElementById('out-'+ci),
}));

function printLine(p,line){
  const el=document.createElement('div');el.className='line';
  if(line.text===''){el.innerHTML='&nbsp;';}
  else{el.innerHTML='<span class="'+line.cls+'">'+esc(line.text)+'</span>';}
  p.term.appendChild(el);p.term.scrollTop=p.term.scrollHeight;
}
function typeCmd(p){
  // type the beat header as a pseudo-command line
  const beatName=p.d.beats[p.beat].name;
  const txt='◆ '+beatName+' ▍ '+p.d.role+' advances';
  if(!p.cur){p.cur=document.createElement('div');p.cur.className='line';p.term.appendChild(p.cur);}
  p.cur.innerHTML='<span class="mut">'+esc(txt.slice(0,p.cc))+'</span><span class="cursor"></span>';
  p.cc+=Math.max(1,Math.round(txt.length/30));
  if(p.cc>=txt.length){
    p.cur.innerHTML='<span class="mut">'+esc(txt)+'</span>';
    p.typing=false;p.cc=0;p.cur=null;p.li=1;
    p.timer=setTimeout(()=>tick(p),250*speed);return;
  }
  p.term.scrollTop=p.term.scrollHeight;p.timer=setTimeout(()=>typeCmd(p),14*speed);
}
function tick(p){
  if(p.done||p.paused)return;
  const beat=p.d.beats[p.beat];
  if(!p.typing){
    if(p.li===0){p.typing=true;updateRail(p);return typeCmd(p);}
    if(p.li<=beat.lines.length){
      printLine(p,beat.lines[p.li-1]);p.li++;
      const dl=beat.lines[p.li-2]?beat.lines[p.li-2].delay:80;
      p.timer=setTimeout(()=>tick(p),dl*speed);return;
    } else {
      // beat done -> pause
      pauseBeat(p);return;
    }
  }
}
function pauseBeat(p){
  p.paused=true;
  p.stat.textContent='phase '+(p.beat+1)+'/6 ✓';
  // advance rail marking
  markBeatDone(p.beat);
  if(p.beat>=BEATS.length-1){
    finishCol(p);return;
  }
  // show continue button (per-column), unless global play
  if(!globalPlay){
    p.cont.disabled=false;p.cont.classList.add('pulse');
    p.cont.textContent='▶ Advance to '+BEATS[p.beat+1];
  } else {
    // auto-advance after a short beat
    p.timer=setTimeout(()=>continueCol(p),900*speed);
  }
}
function continueCol(p){
  if(p.done)return;
  p.paused=false;p.cont.disabled=true;p.cont.classList.remove('pulse');
  p.beat++;p.li=0;
  if(p.beat>=BEATS.length){finishCol(p);return;}
  p.stat.textContent='phase '+(p.beat+1)+'/6';
  tick(p);
}
function finishCol(p){
  p.done=true;p.paused=true;
  p.cont.disabled=true;p.cont.classList.remove('pulse');p.cont.textContent='✓ complete';
  p.stat.textContent='complete';
  p.out.textContent=p.d.outcome||'';
  // print outcome into term too
  if(p.d.outcome){
    const el=document.createElement('div');el.className='line';el.style.marginTop='6px';
    el.innerHTML='<span class="ok">'+esc(p.d.outcome)+'</span>';
    p.term.appendChild(el);p.term.scrollTop=p.term.scrollHeight;
  }
  if(players.every(x=>x.done)){stopTimer();notifyState();}
}
function updateRail(p){
  // light up the current beat for the slowest active column
  const minBeat=Math.min(...players.filter(x=>!x.done).map(x=>x.beat));
  BEATS.forEach((b,i)=>{
    const el=document.getElementById('beat-'+i);
    el.classList.remove('on','done');
    if(i<minBeat)el.classList.add('done');
    else if(i===minBeat)el.classList.add('on');
  });
}
function markBeatDone(i){
  // mark a beat done when ALL columns have passed it
  const allPast=players.every(p=>p.beat>i||p.done);
  if(allPast){document.getElementById('beat-'+i).classList.add('done');
    document.getElementById('beat-'+i).classList.remove('on');}
}

// ---- controls ----
function startCol(p){if(p.done)resetCol(p);p.paused=false;p.cont.disabled=true;p.cont.classList.remove('pulse');p.cont.textContent='… running';tick(p);}
function resetCol(p){clearTimeout(p.timer);p.term.innerHTML='';p.beat=0;p.li=0;p.typing=false;p.done=false;p.paused=true;p.cc=0;p.cur=null;
  p.cont.disabled=false;p.cont.classList.remove('pulse');p.cont.textContent='▶ Begin';p.stat.textContent='phase 1/6';p.out.textContent='';
  BEATS.forEach((b,i)=>{document.getElementById('beat-'+i).classList.remove('on','done');});}

players.forEach(p=>{
  p.cont.onclick=()=>{ if(p.paused&&!p.done) startCol(p); };
});
function runAll(){
  globalPlay=true;
  startTimer();
  players.forEach(p=>{ if(p.paused&&!p.done) startCol(p); });
  notifyState();
}
function resetAll(){
  globalPlay=false; stopTimer(); if(window.actAPI.onTimer) window.actAPI.onTimer('00:00');
  players.forEach(resetCol);
  notifyState();
}
window.actAPI = {
  kind: 'agents',
  run: runAll,
  advance: null,           // agents pane has no single 'advance' (per-column buttons do that)
  reset: resetAll,
  setSpeed: (v)=>{ speed=parseFloat(v); },
  onTimer: null,
  state: ()=>({ running:globalPlay, done:players.every(p=>p.done), active:players.filter(p=>!p.done).length })
};
let onState=null;
function notifyState(){ const cb=(window.actAPI&&window.actAPI.onState)||onState; if(cb) cb(window.actAPI.state()); }

function startTimer(){if(t0)return;t0=Date.now();tInterval=setInterval(()=>{
  const s=Math.floor((Date.now()-t0)/1000);
  const mm=String(Math.floor(s/60)).padStart(2,'0'), ss=String(s%60).padStart(2,'0');
  if(window.actAPI.onTimer) window.actAPI.onTimer(mm+':'+ss);
},500);}
function stopTimer(){if(tInterval){clearInterval(tInterval);tInterval=null;}}
</script>
</body>
</html>
