# ---- odoo-synth control panel configuration ----
# Community-release config. Nothing hardcoded in code.
#
# Model:
#   * SOURCE  = a live Postgres database the user points at (a connection URL/DSN
#               entered per run). greenmask dumps + masks it directly.
#   * DESTINATION = always (re)created by us on the configured RDS (resolved
#               server-side from env). The user is NOT asked where it goes.
#   * OUTPUT  = optionally also produce a downloadable pg_dump of the masked DB.

aws:
  # S3 bucket used to store the optional downloadable masked dump. Referenced by
  # env-var name so each deployment points at its own bucket.
  dump_s3_bucket_env: DUMP_S3_BUCKET
  dump_s3_prefix: masked-dumps

# The masked destination DB (created on RDS). Host/creds resolved server-side
# from these env vars; never shown to or entered by the user.
destination:
  label: "Masked RDS (managed)"
  host_env: RDS_ENDPOINT
  port: 5432
  dbname_env: TARGET_DB_NAME
  user_env: TARGET_DB_USER
  password_env: TARGET_DB_PASSWORD

# Masking profiles map 1:1 to masker/profiles/<id>.yml baked into the masker
# image. Selectable now; UI-editable later.
mask_profiles:
  - id: odoo-core-pii
    label: "Odoo core PII"
    description: "Masks res_partner / res_company / res_users PII (names, emails, phones, address, VAT, login)."
  - id: minimal-demo
    label: "Minimal (demo/smoke)"
    description: "res_partner name + email only. Fast, for demos."

# Default post-mask neutralize toggles + admin reset (exposed in the UI).
neutralize_defaults:
  mail: true
  fetchmail: true
  payment: true
  smtp_param: true
reset_admin_login: true
gm_jobs: 4

# ---- developer environments ------------------------------------------------
# Ephemeral, isolated VS Code (code-server) instances launched per GitHub issue,
# seeded from a masked pg_dump artifact. One EC2 instance per environment from a
# pre-baked golden AMI (see environments/provision.sh). Torn down on teardown.
#
# Infra values are referenced by env-var name (*_env) so nothing is hardcoded;
# set them in config.env / deploy/state.env for your account.
environments:
  enabled: true
  ami_id_env: ENV_AMI_ID                      # golden AMI id
  instance_type: t3.large
  subnet_id_env: ENV_SUBNET_ID                # subnet with route to the masked VPC
  security_group_id_env: ENV_SG_ID            # SG: inbound code_port from your CIDR, egress to S3/RDS
  instance_profile_env: ENV_INSTANCE_PROFILE  # IAM profile: read masked-dump S3 + get the env secret
  key_name_env: ENV_KEY_NAME                  # optional EC2 keypair for break-glass ssh
  assign_public_ip: true
  code_port: 8443                             # code-server TLS port -> https://<ip>:8443
  db_name: odoo                               # local DB name seeded from the masked dump
  repo_url_env: ENV_REPO_URL                  # addons repo cloned into the workspace
  repo_branch_env: ENV_REPO_BRANCH
  secret_prefix: odoo-synth/env               # Secrets Manager path prefix for per-env passwords

