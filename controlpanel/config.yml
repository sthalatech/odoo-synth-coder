# ---- odoo-synth control panel configuration ----
# Community-release config. Nothing hardcoded in code.
#
# Model:
#   * SOURCE  = a live Postgres database the user points at (a connection URL/DSN
#               entered per run). greenmask dumps + masks it directly.
#   * DESTINATION = always (re)created by us on the configured RDS (resolved
#               server-side from env). The user is NOT asked where it goes.
#   * OUTPUT  = optionally also produce a downloadable pg_dump of the masked DB.

aws:
  # S3 bucket used to store the optional downloadable masked dump. Referenced by
  # env-var name so each deployment points at its own bucket.
  dump_s3_bucket_env: DUMP_S3_BUCKET
  dump_s3_prefix: masked-dumps

# The masked destination DB (created on RDS). Host/creds resolved server-side
# from these env vars; never shown to or entered by the user.
destination:
  label: "Masked RDS (managed)"
  host_env: RDS_ENDPOINT
  port: 5432
  dbname_env: TARGET_DB_NAME
  user_env: TARGET_DB_USER
  password_env: TARGET_DB_PASSWORD

# Masking profiles map 1:1 to masker/profiles/<id>.yml baked into the masker
# image. Selectable now; UI-editable later.
mask_profiles:
  - id: odoo-core-pii
    label: "Odoo core PII"
    description: "Masks res_partner / res_company / res_users PII (names, emails, phones, address, VAT, login)."
  - id: minimal-demo
    label: "Minimal (demo/smoke)"
    description: "res_partner name + email only. Fast, for demos."

# Default post-mask neutralize toggles + admin reset (exposed in the UI).
neutralize_defaults:
  mail: true
  fetchmail: true
  payment: true
  smtp_param: true
reset_admin_login: true
gm_jobs: 4

# ---- developer environments (Coder) ----------------------------------------
# Ephemeral, isolated VS Code (code-server) workspaces launched per GitHub issue
# by the Coder server (deploy/11_coder_server.sh), seeded from a masked pg_dump.
# The Coder template (coder/templates/odoo-synth-env) launches one EC2 instance
# per workspace from the existing thin golden AMI -- no public IP, no per-env SG
# rules, no per-env Secrets Manager secret. Access is brokered via the Coder
# server's Wireguard tunnel. See controlpanel/backend/environments.py (thin CLI
# shim) for the lifecycle.
environments:
  enabled: true
  coder_url_env: CODER_URL                    # Coder server URL (set by 11_coder_server.sh)
  coder_session_token_env: CODER_SESSION_TOKEN  # API token from `coder login`
  ami_id_env: ENV_AMI_ID                      # golden AMI id (thin: ubuntu + docker + code-server)
  instance_type: t3.large
  subnet_id_env: ENV_SUBNET_ID                # default-VPC subnet for workspace VMs
  security_group_id_env: ENV_SG_ID            # env SG (egress only; Coder tunnel carries access)
  instance_profile_env: ENV_INSTANCE_PROFILE  # IAM profile: S3 dump read + ECR pull
  db_name: odoo                               # local DB name seeded from the masked dump
  # The provenance-baked Odoo image the env runs against the masked DB. Left as
  # odoo_image_tag so it resolves to <acct>.dkr.ecr.<region>/<project>/odoo:<tag>;
  # a run seeded-from overrides this with the exact image it used.
  odoo_image_tag: latest
  # odoo_image_env: ENV_ODOO_IMAGE            # or pin the full image URI via env
  repo_url_env: ENV_REPO_URL                  # addons repo cloned + live-mounted (default: CUSTOM_ADDONS_GIT_URL)
  repo_branch_env: ENV_REPO_BRANCH            # default: CUSTOM_ADDONS_GIT_REF
  git_token_secret_env: ENV_GIT_TOKEN_SECRET  # optional Secrets Manager arn: GitHub token for private repo clone


