<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>odoo-synth · masking control panel</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>odoo-synth <span class="muted">masking control panel</span></h1>
    <div id="infobar" class="infobar"></div>
  </header>

  <main>
    <section class="panel">
      <h2>Start a run</h2>
      <form id="run-form">
        <label>Operation
          <select id="operation" name="operation">
            <option value="mask">mask &mdash; source &rarr; masked target</option>
            <option value="restore">restore &mdash; load a dump into a database</option>
          </select>
        </label>

        <!-- ===== RESTORE fields ===== -->
        <fieldset id="restore-fields" class="hidden">
          <legend>Restore</legend>
          <label>Dump source
            <select id="source_type"></select>
          </label>
          <p id="source_hint" class="muted small"></p>

          <div id="field-url" class="src-field hidden">
            <label>URL
              <input type="text" id="url" placeholder="https://...dump.sql or backup.zip" />
            </label>
          </div>

          <div id="field-file" class="src-field hidden">
            <label>File
              <input type="file" id="file" accept=".sql,.zip" />
            </label>
            <button type="button" id="upload-btn" class="secondary">Upload &amp; stage</button>
            <span id="upload-status" class="muted small"></span>
          </div>

          <div id="field-dsn" class="src-field hidden">
            <label>Source DSN
              <input type="text" id="dsn" placeholder="postgresql://user:pass@host:5432/dbname" />
            </label>
          </div>

          <label>Target connection
            <select id="restore_target_conn" class="conn-select"></select>
          </label>
          <label>Target DB name <span class="muted">(blank = profile default)</span>
            <input type="text" id="restore_target_db" placeholder="e.g. source" />
          </label>
        </fieldset>

        <!-- ===== MASK fields ===== -->
        <fieldset id="mask-fields" class="hidden">
          <legend>Mask</legend>
          <label>Source connection
            <select id="mask_source_conn" class="conn-select"></select>
          </label>
          <label>Target connection
            <select id="mask_target_conn" class="conn-select"></select>
          </label>
          <label>Target DB name <span class="muted">(blank = profile default)</span>
            <input type="text" id="mask_target_db" placeholder="e.g. masked" />
          </label>
          <label>Masking profile
            <select id="mask_profile"></select>
          </label>
          <p id="mask_profile_hint" class="muted small"></p>

          <label>Admin password <span class="muted">(optional; default from config)</span>
            <input type="password" id="admin_password" placeholder="leave blank for configured default" />
          </label>
          <label>greenmask jobs
            <input type="number" id="gm_jobs" min="1" max="16" />
          </label>

          <div class="toggles">
            <span class="toggles-title">Neutralize (post-mask)</span>
            <label class="chk"><input type="checkbox" id="neutralize_mail" /> Mail servers</label>
            <label class="chk"><input type="checkbox" id="neutralize_fetchmail" /> Fetchmail</label>
            <label class="chk"><input type="checkbox" id="neutralize_payment" /> Payment providers</label>
            <label class="chk"><input type="checkbox" id="neutralize_smtp_param" /> SMTP force param</label>
            <label class="chk"><input type="checkbox" id="reset_admin_login" /> Reset admin login to 'admin'</label>
          </div>
        </fieldset>

        <button type="submit" id="start-btn">Start</button>
      </form>
    </section>

    <section class="panel">
      <div class="row-between">
        <h2>Live log</h2>
        <span id="status-badge" class="badge idle">idle</span>
      </div>
      <pre id="log" class="log"></pre>
      <div id="result" class="result hidden"></div>
    </section>

    <section class="panel">
      <h2>Recent runs</h2>
      <table id="runs">
        <thead>
          <tr><th>id</th><th>op</th><th>status</th><th>exit</th><th>started</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
