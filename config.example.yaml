# =====================================================================
# odoo-synth configuration -- the single source of truth.
# =====================================================================
# Copy this file to `config.yaml` and fill in the values, then run:
#     bash deploy/00_validate_config.sh
# to check it before installing. `config.yaml` is gitignored -- never commit
# real passwords, account ids, or private repo URLs.
#
# Secrets: any value can be written inline OR delegated to an env var / SSM
# path so secrets never live in this file. Use the `ref:` form:
#     password: { ref: env:ODOO_ADMIN_PASSWORD }   # read from env var
#     password: { ref: ssm:odoo-synth/admin-password }  # read from SSM Param
# A plain string is taken literally.
#
# This is the single source of truth (it replaces the old flat `config.env`
# and `lib/config.yml`). `deploy/lib.sh` loads it via
# `deploy/_yaml_to_env.py` and exports the same env vars the pipeline scripts
# expect, so no script had to change. The Python backend reads it directly.
#
# SCOPE: this file holds ONLY install-time + control-plane settings (AWS
# account/project, the dumps bucket, greenmask version, Coder server, the
# golden-AMI/workspace wiring). Odoo provenance (series/git_url/git_ref/image),
# custom addons, and all database credentials (source/masked, admin/master
# passwords) are NOT here -- they are per-PROFILE and per-MASK/run concerns,
# supplied downstream via `odoo-synth profile create` and the mask/env CLI
# commands (secrets via env vars or Secrets Manager). Do not re-add them.
# =====================================================================

aws:
  region: us-east-1
  project: odoo-synth          # all AWS resources are named <project>-*

build:
  # ECR repo for the provenance-baked odoo image (<acct>.dkr.ecr.<region>/<project>/odoo)
  ecr_repo: odoo-synth/odoo
  builder_instance_type: t3.large

mask:
  greenmask_version: v0.2.22
  # S3 bucket for masked dump artifacts + uploaded source dumps. Per-deployment.
  dumps_bucket: "<your-dumps-bucket>"
  dumps_prefix: masked-dumps
  # Selectable mask profiles (1:1 with masker/profiles/<id>.yml in the image).
  profiles:
    - id: odoo-core-pii
      label: "Odoo core PII"
      description: "Masks res_partner / res_company / res_users PII (names, emails, phones, address, VAT, login)."
    - id: minimal-demo
      label: "Minimal (demo/smoke)"
      description: "res_partner name + email only. Fast, for demos."
  # Default post-mask neutralize toggles + admin reset (exposed in the UI/CLI).
  neutralize_defaults:
    mail: true
    fetchmail: true
    payment: true
    smtp_param: true
  reset_admin_login: true
  gm_jobs: 4

coder:
  # The Coder control plane (deployed by deploy/11_coder_server.sh) launches
  # isolated dev workspaces from the env template, each hydrated from a masked
  # dump. Coder also owns users + workspace lifecycle (panel no longer does).
  instance_type: t3.large
  volume_gb: 40
  port: 8943
  # Set after `coder login <url>`; stored here for CLI convenience. Can also be
  # supplied via env (CODER_SESSION_TOKEN) to keep it out of the file.
  session_token: { ref: env:CODER_SESSION_TOKEN }
  # Per-user Coder secret name holding the Anthropic API key for Claude Code in
  # dev workspaces. Created via `coder secrets add anthropic-api-key ...`.
  anthropic_secret_name: anthropic-api-key

# Developer environments (Coder workspaces). Ephemeral, isolated workspaces
# launched per GitHub issue by the Coder server (deploy/11_coder_server.sh),
# seeded from a masked pg_dump. The Coder template launches one EC2 instance per
# workspace from the golden AMI -- no public IP, no per-env SG/secret; access is
# brokered via the Coder server's Wireguard tunnel. *_env values are env-var
# NAMES resolved at runtime so each deployment points at its own resources.
environments:
  enabled: true
  coder_url_env: CODER_URL                      # set by 11_coder_server.sh
  coder_session_token_env: CODER_SESSION_TOKEN  # API token from `coder login`
  ami_id_env: ENV_AMI_ID                        # golden AMI id (09_dev_env.sh)
  instance_type: t3.large
  subnet_id_env: ENV_SUBNET_ID                  # default-VPC subnet for workspace VMs
  security_group_id_env: ENV_SG_ID             # env SG (egress only; Coder tunnel)
  instance_profile_env: ENV_INSTANCE_PROFILE    # IAM: S3 dump read + ECR pull
  db_name: odoo                                 # local DB name seeded from the dump
  odoo_image_tag: latest                        # fallback tag if no profile image is set
  repo_url_env: ENV_REPO_URL                    # addons repo (default: addons.custom_git_url)
  repo_branch_env: ENV_REPO_BRANCH              # default: addons.custom_git_ref
  git_token_secret_env: ENV_GIT_TOKEN_SECRET    # optional: Secrets Manager arn for private repo clone

# Resolved at install time into deploy/state.env (do not hand-edit here).
# These are written by the deploy scripts; listed for documentation only.
# state: { coder_url: "", env_ami_id: "", env_sg_id: "", env_subnet_id: "", env_instance_profile: "" }

# ---------------------------------------------------------------------------
# GitHub issue -> env webhook (deploy/13_webhook_listener.sh).
# The webhook listener runs ON THE CODER SERVER and receives `issues` events
# from the profile's addons repo. The secret is the HMAC key GitHub signs the
# webhook body with; it must match the Secret field in the repo's webhook
# config on GitHub. Use the ref:env form so the secret never lives in this file.
github:
  webhook_secret: { ref: env:GITHUB_WEBHOOK_SECRET }
  # webhook_secret_env: GITHUB_WEBHOOK_SECRET   # alt: name an env var holding it
