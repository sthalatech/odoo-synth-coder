# pyproject.toml — odoo-synth
#
# Build/packaging metadata for the odoo-synth CLI + backend library.
#
# This makes the repo `pip install -e .`-able so an editable install puts the
# `odoo-synth` console script on PATH and exposes the `backend` package on
# sys.path without each caller having to sys.path.insert() the lib/ dir.
#
# IMPORTANT — repository-layout assumption:
#   The backend resolves repo-relative paths from __file__ at runtime:
#     lib/backend/config.py        -> REPO_ROOT = parents[2]   (config.yaml, deploy/state.env)
#     lib/backend/env_store.py     -> _ENVS_PATH = parent/envs.yaml
#     lib/backend/profile_store.py -> _PROFILES_DIR = parents[2]/profiles
#     lib/backend/environments.py  -> AGENT_SYSTEM_PROMPT_PATH = coder/templates/.../agent-system-prompt.md
#   These resolve correctly under an EDITABLE install (`pip install -e .`),
#   where module __file__ still points into the checkout. They do NOT survive
#   a copied/wheel install into site-packages, because the repo tree
#   (config.yaml, profiles/, coder/templates/) is not shipped with the package.
#   For now the supported install mode is editable, from a clone of the repo —
#   which matches how the tool is actually used (it drives infra in this repo).

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-synth"
version = "0.1.0"
description = "Odoo database masking + synthetic-data developer-environment pipeline (CLI + library)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD — see LICENSE" }
authors = [{ name = "odoo-synth contributors" }]
keywords = ["odoo", "masking", "greenmask", "coder", "synthetic-data", "postgres"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "boto3>=1.35",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/sthalatech/odoo-synth-coder"
Repository = "https://github.com/sthalatech/odoo-synth-coder"
Issues = "https://github.com/sthalatech/odoo-synth-coder/issues"

[project.optional-dependencies]
# `pip install -e ".[dev]"` — linting + formatting for contributors.
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
]
# `pip install -e ".[test]"` — reserved for when tests land.
test = [
    "pytest>=8",
]

[project.scripts]
# Installs an `odoo-synth` executable on PATH that calls cli.main().
odoo-synth = "cli:main"

# --- packaging layout ------------------------------------------------------
#
# We do NOT use a src/ layout (deliberately, for now): the backend resolves
# repo-relative paths from __file__, so the package must live where the rest of
# the repo tree (config.yaml, profiles/, coder/templates/, deploy/) is a known
# relative distance away. Two importable packages are mapped onto the repo:
#
#   cli/      -> the `cli` package      (cli/__init__.py — argparse entry, main())
#   lib/      -> the `backend` package  (lib/backend/__init__.py — the library)
#
# `cli/odoo-synth` is kept as a thin launcher so the historical
# `./cli/odoo-synth` invocation and the deploy/00_install_prereqs.sh symlink
# target keep working; the console-script entry point above is the install-time
# equivalent.

[tool.setuptools]
# Ship only the python packages, not the whole repo (config.yaml, deploy/,
# odoo/, masker/, coder/ are NOT pip-installable artifacts — they're infra).
# A non-editable build would omit them, which is fine for the library surface
# but breaks the repo-relative path resolution noted above; use editable mode.

[tool.setuptools.packages.find]
# cli/ is at the repo root; lib/ provides the `backend` package.
where = [".", "lib"]
include = ["cli*", "backend*"]

[tool.setuptools.package-data]
# Keep envs.yaml out (it's gitignored runtime state); nothing to ship yet.
backend = []

# --- tool config (nice to have for contributors) ---------------------------

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Conservative defaults — the existing code uses noqa for deliberate escapes.
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# The backend uses runtime `from __future__ import annotations` everywhere, so
# strict typing is aspirational; start non-strict.
